<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Da 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
margin:0;
overflow:hidden;
font-family:Poppins;
background: linear-gradient(to top, #000814, #001d3d, #003566);
}

/* 🌌 STARS */
.stars{
position:absolute;
width:100%;
height:60%;
top:0;
left:0;
z-index:0;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
0%,100%{opacity:0.2;}
50%{opacity:1;}
}

/* 🌙 MOON */
.moon{
position:absolute;
top:60px;
right:80px;
width:100px;
height:100px;
border-radius:50%;
background: radial-gradient(circle at 30% 30%, #fff8c6, #bdb78c);
box-shadow:0 0 40px rgba(255,255,200,0.4);
}

/* 🌊 WAVES */
.wave{
position:absolute;
bottom:0;
left:0;
width:200%;
height:180px;
background:url("https://i.imgur.com/3ZQ3ZQk.png");
background-size:cover;
opacity:0.4;
animation:waveMove 8s linear infinite;
}

.wave:nth-child(2){opacity:0.25; animation-duration:12s;}
.wave:nth-child(3){opacity:0.15; animation-duration:18s;}

@keyframes waveMove{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* 🏖️ SAND */
.sand{
position:absolute;
bottom:0;
width:100%;
height:120px;
background: linear-gradient(to top,#c2a679,#f5deb3);
}

/* 💌 CONTAINER */
.container{
position:relative;
z-index:5;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* ENVELOPE */
.envelope{
width:280px;
height:170px;
background:white;
border-radius:10px;
cursor:pointer;
transition:0.7s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
position:relative;
}

.envelope:before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:50%;
background:#e6e6e6;
clip-path:polygon(0 0,100% 0,50% 100%);
transition:0.6s;
}

.envelope.open{
width:85%;
height:75vh;
background:#fffaf0;
}

/* 📜 LETTER FIXED */
#letter{
display:none;
font-family:"Playfair Display";
color:#222;
white-space:pre-line;
height:100%;
overflow-y:auto;
padding:20px;
position:relative;
z-index:10;
}

.envelope.open #letter{
display:block;
}

/* TITLE */
h1{
position:absolute;
top:20px;
width:100%;
text-align:center;
color:white;
z-index:10;
}
</style>
</head>

<body>

<h1>🌊 Happy Birthday Da 💙</h1>

<div class="stars" id="stars"></div>
<div class="moon"></div>

<div class="container">
<div class="envelope" onclick="openMail(this)">
<div id="letter"></div>
</div>
</div>

<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="sand"></div>

<script>

/* 🌌 STARS */
const starBox=document.getElementById("stars");

for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
starBox.appendChild(s);
}

/* 💌 FULL LETTER (YOUR EXACT CONTENT RESTORED) */
const letter = `I don’t really know how to put everything into perfect words but I just wanted to share something.

I m really grateful that life brought me to APSA and that I got to know you. You have been a part of some of my best school memories  and I will always value that.

There were times I could not express things properly but the bond we share is something really rare and genuine. Even now I m really happy we have each other's support. Maybe we see this as friendship….. and sometimes we might even argue whether its love or not. But for me its something more than just a label. Its care,affection and a kind of connection that feels pure and genuine…. something calm, respectful and beyond expectations.

You will always be that kutty yusuf to me smiling so innocently no matter how much you grow. Maybe with time everything can change but the care and respect I have for you will always remain.

I m not sure how our friendship will go from here but I just want you to know… whenever you feel heavy or need someone to talk to you can always come to me. I will be there. Even after so many fights I still value what we share… because somehow we always come back and choose to understand each other again. I act like I m tired of you but if you actually stop talking I will be the first one to come back. And if I ever do something that hurts you please don’t hesitate to tell me or even fight with me… you have that right.

Don’t get too proud I value you this much only because I like you a little (Note: very little)

I m really sorry about the gift. It wasn’t about the money I just wanted to do something special for you…especially since it was my first gift. It didn’t go as planned I didn’t mean for it to turn into a fight. Next time… I’ll make it way more than you expect. Anyway just know this next time the gift is going to be way more than you expect and this time nothings going to go wrong…I ll make sure of it.

No matter where life takes us, you will always be someone special to me. Stay happy, keep chasing your dreams and have a beautiful year ahead.
Happy Birthday Mahh 💙 Stay shine ✨️`;

/* OPEN */
function openMail(box){
box.classList.add("open");

let el=document.getElementById("letter");
el.innerHTML=letter;
}
</script>

</body>
</html>
